<div class="talk-list">
  {% for talk in site.data.talks %}
    <article class="talk">
      <div>
        <h2>{{ talk.title }}</h2>
        <p>{{ talk.type }}, {{ talk.event }}{% if talk.location %}, {{ talk.location }}{% endif %}, {{ talk.year }}</p>
      </div>
      <div class="publication-links">
        {% if talk.slides %}<a href="{{ talk.slides | relative_url }}">Slides</a>{% endif %}
        {% if talk.video %}<a href="{{ talk.video | relative_url }}">Video</a>{% endif %}
      </div>
    </article>
  {% endfor %}
</div>
