<header class="site-header">
  <div class="container nav-shell">
    <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} homepage">
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for item in site.data.navigation %}
        {% if item.key == "notes" and site.data.site_settings.show_notes != true %}
          {% continue %}
        {% endif %}
        {% assign is_current = false %}
        {% if page.url == item.url %}
          {% assign is_current = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}" {% if is_current %}aria-current="page"{% endif %}>{{ item.text }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
