---
layout: default
---

<article class="post-page">
  <header class="page-header">
    <div class="container">
      <p class="eyebrow">Note</p>
      <h1>{{ page.title }}</h1>
      <p class="page-description">
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        {% if page.tags.size > 0 %}
          <span class="tag-row">
            {% for tag in page.tags %}
              <span>{{ tag }}</span>
            {% endfor %}
          </span>
        {% endif %}
      </p>
    </div>
  </header>
  <div class="page-body">
    <div class="container prose">
      {{ content }}
    </div>
  </div>
</article>
