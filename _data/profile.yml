summary: >-
  I am a Chicago Prize Postdoctoral Fellow at the Pritzker School of Molecular Engineering at the University of Chicago, with close collaboration with Professor Aashish Clerk. I received my Ph.D. degree in Physics from the University of Colorado Boulder in 2024 under the supervision of Professor Ana Maria Rey, and my B.Sc. degree in Physics from Tsinghua University in 2018 under the supervision of Professor Luming Duan. I was awarded the Boeing Quantum Creators Prize in 2023. My research focuses on the theory of quantum sensing, simulation, computation and open quantum systems, with an emphasis on their implementation in highly controllable atomic, molecular, and optical platforms.
