- title: "A magic recipe for a quantum interferometer"
  kicker: "Quantum Metrology"
  image: /assets/images/CavityInterferometer.png
  image_background: "#071827"
  image_alt: ""
  summary: >-
    Ultracold atomic systems offer tremendous potential for quantum sensing applications including time keeping and gravimetry, and thus provide opportunities for searching or constraining new physics in outstandingly precise and compact experiments. We propose a quantum enhanced interferometric protocol for gravimetry and force sensing using cold atoms in an optical lattice supported by a standing-wave cavity. By loading the atoms in partially delocalized Wannier-Stark states, it is possible to cancel the undesirable inhomogeneities arising from the mismatch between the lattice and cavity fields and to generate spin squeezed states via a uniform one-axis twisting model, overcoming relevant limitations faced by current atomic sensors. The quantum enhanced sensitivity of the states is combined with the subsequent application of a compound pulse sequence that allows us to separate atoms by several lattice sites. This, together with the capability to load small atomic clouds in the lattice at micrometric distances from a surface, make our setup ideal for sensing short-range forces.
