- title: "Photon-mediated exchange interactions between matter waves"
  kicker: "Quantum Metrology"
  image: /assets/images/MomentumExchange.avif
  image_background: "#071827"
  image_alt: ""
  summary: >-
    Large ensembles of laser-cooled atoms interacting through infinite-range photon-mediated interactions are powerful platforms for quantum simulation and sensing. We realize momentum-exchange interactions in which pairs of atoms exchange their momentum states by collective emission and absorption of photons from a common cavity mode, a process equivalent to a spin-exchange or XX collective Heisenberg interaction. The momentum-exchange interaction leads to an observed all-to-all Ising-like interaction in a matter-wave interferometer. A many-body energy gap also emerges, effectively binding interferometer matter-wave packets together to suppress Doppler dephasing in analogy to Mössbauer spectroscopy. The tunable momentum-exchange interaction expands the capabilities of quantum interaction-enhanced matter-wave interferometry and may enable the realization of exotic behaviors, including simulations of superconductors and dynamical gauge fields.
