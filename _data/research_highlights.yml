- title: "Symmetry-protected topological optical lattice clock"
  kicker: "Quantum Metrology"
  image: /assets/images/SPTOLC.avif
  image_background: "#071827"
  image_alt: ""
  summary: >-
    Optical lattice clocks (OLCs) use the splitting between two long-lived electronic levels in an atom to provide an unrivaled definition of the second. These clocks have reached record levels of precision, but they will soon reach the point where their steady progress will be limited by small but unwanted experimental imperfections. Therefore, finding protocols to make OLCs more robust is an important milestone. We propose a way to make a leap forward by taking advantage of the robustness offered by "symmetry-protected topological" (SPT) phases. An SPT phase is a type of quantum matter, which minimizes the energy of a Hamiltonian that obeys specific "symmetries." Its topological character stems from the fact that it remains unaffected to all perturbations that preserve these symmetries. Here, first we show how to create an SPT phase in a tilted OLC and how to probe its topological robustness with standard spectroscopic tools. Next, we show that the intrinsic robustness of such a phase can indeed help to reduce the statistical noise arising from certain experimental imperfections and thus help to improve phase-estimation tasks relevant for frequency standards and inertial sensing. Our work bridges several rapidly developing fields in physics and may help open up a new experimental paradigm, which benefits from topologically robust states of matter for enhanced quantum sensing.
