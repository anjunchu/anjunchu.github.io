- title: "Unveiling BCS superconductivity in a cavity QED simulator"
  kicker: "Quantum Simulation"
  image: /assets/images/BCS.png
  image_background: "#071827"
  image_alt: ""
  summary: >-
    In conventional Bardeen-Cooper-Schrieffer (BCS) superconductors, electrons with opposite momenta bind into Cooper pairs due to an attractive interaction mediated by phonons in the material. Although superconductivity naturally emerges at thermal equilibrium, it can also emerge out of equilibrium when the system parameters are abruptly changed. The resulting out-of-equilibrium phases are predicted to occur in real materials and ultracold fermionic atoms, but not all have yet been directly observed. Here we realize an alternative way to generate the proposed dynamical phases using cavity quantum electrodynamics (QED). Our system encodes the presence or absence of a Cooper pair in a long-lived electronic transition in 88Sr atoms coupled to an optical cavity and represents interactions between electrons as photon-mediated interactions through the cavity. We observe regimes in which the order parameter decays to zero (phase I), assumes a non-equilibrium steady-state value (phase II) or exhibits persistent oscillations (phase III). This opens up exciting prospects for quantum simulation, including the potential to engineer unconventional superconductors and to probe beyond mean-field effects, and for increasing the coherence time for quantum sensing.
