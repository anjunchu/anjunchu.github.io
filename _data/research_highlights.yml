- title: "Trade-offs between unitary and measurement induced spin squeezing"
  kicker: "Quantum Metrology"
  image: /assets/images/OATvsQND.avif
  image_background: "#071827"
  image_alt: ""
  summary: >-
    Within the field of quantum metrology, spin squeezed states constitute a concrete example of a quantum-enhanced resource with near-term practical applications. Particularly promising strategies for the scalable generation of squeezing are provided by cavity QED systems. When driven by an external laser, the resulting dispersive atomic response is nonlinear and can be interpreted as an infinite range unitary Ising interaction called one-axis-twisting (OAT). On the other hand, after atoms and light interact, photons leaking out of the cavity carry information about the atomic ensemble that can be accessed by continuously monitoring the output light via quantum nondemolition (QND) measurements. We study the combined effects of QND and OAT on the preparation of spin squeezing in an ensemble of atoms interacting with a single electromagnetic field mode inside a cavity. We derive simple criteria that determine the conditions at which QND entanglement generation overperforms OAT protocols. Our conclusions are relevant for state-of-the-art atomic clocks that aim to operate below the standard quantum limit.
