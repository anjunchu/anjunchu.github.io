- title: "Engineering multi-body interactions between atomic momentum states"
  kicker: "Quantum Simulation"
  image: /assets/images/ThreeBody.avif
  image_background: "#071827"
  image_alt: ""
  summary: >-
    Interactions between pairs of particles often dominate over those in which three or more particles couple directly. To implement such higher-order interactions, experimental challenges include not only implementing them in a genuine many-particle system with more than a few atoms but also eliminating the lower-order interactions to make them dominant. We realized an effective three-body Hamiltonian interaction using an ensemble of laser-cooled atoms in a high-finesse optical cavity with the pseudospin encoded by two atomic momentum states. We applied two dressing tones that induce the atoms to exchange photons via the cavity to realize a virtual six-photon process, with lower-order interactions destructively interfered. We also observed signatures of a four-body interaction mediated by a virtual eight-photon process. Our approach may be extensible to three-body interactions in multilevel systems or to even higher-order interactions.
