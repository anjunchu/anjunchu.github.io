- title: "A new simple recipe for highly entangled states of spin ensembles"
  kicker: "Open Quantum System"
  image: /assets/images/SteadyState.webp
  image_background: "#071827"
  image_alt: ""
  summary: >-
    Stabilizing complex entangled states against decoherence remains a central challenge in quantum science, often requiring intricate and specialized dissipative processes. We introduce a versatile framework that overcomes this complexity by utilizing a single collective decay process, ubiquitous in cavity QED systems, augmented with easily tunable laser detunings and spin interactions. By breaking permutation symmetry, we dissipatively stabilize a broad family of noncollective many-body states with exact analytical descriptions. Our approach enables multiensemble quantum sensors that achieve Heisenberg-limited sensitivity to field gradients and curvatures while remaining robust to common-mode noise. Furthermore, we demonstrate the stabilization of symmetry-protected topological order, including the celebrated Affleck-Kennedy-Lieb-Tasaki state. These results indicate that simple, naturally occurring dissipation can be reimagined as a reconfigurable tool for engineering both metrological resources and exotic phases of quantum matter.
