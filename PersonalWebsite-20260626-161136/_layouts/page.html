---
layout: default
---

<section class="page-header">
  <div class="container">
    <p class="eyebrow">{{ site.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="page-description">{{ page.description }}</p>
    {% endif %}
  </div>
</section>

<section class="page-body">
  <div class="container prose">
    {{ content }}
  </div>
</section>
