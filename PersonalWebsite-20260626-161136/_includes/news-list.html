{% assign limit = include.limit | default: site.data.news.size %}
<ol class="news-list">
  {% for item in site.data.news limit: limit %}
    <li>
      <time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%Y.%m.%d" }}</time>
      {% if item.url %}
        <a href="{{ item.url }}">{{ item.text }}</a>
      {% else %}
        <span>{{ item.text }}</span>
      {% endif %}
    </li>
  {% endfor %}
</ol>
